name: Windows release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: python tools/check_public_source.py
      - run: npm ci
      - run: npm run build:ui
      - run: npm run check:ui
      - run: npm run test:ui
      - run: python -m pip install -r requirements-dev.txt
      - run: python -I -B tools/run_all_tests.py
      - run: python -I -B build_desktop.py
      - run: python -I -B tools/build_public_release.py --release dist/StructBoardTauri --output dist/public
      - uses: actions/upload-artifact@v4
        with:
          name: StructBoard-windows-x64
          path: |
            dist/public/*.exe
            dist/public/*.zip
            dist/public/SHA256SUMS.txt
