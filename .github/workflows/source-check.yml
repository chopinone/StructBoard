name: Source boundary and regression checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/check_public_source.py
      - run: npm ci
      - run: npm run build:ui
      - run: npm run check:ui
      - run: npm run test:ui
      - run: python -m pip install -r requirements-dev.txt
      - run: python -I -B tools/run_all_tests.py
